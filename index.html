<!DOCTYPE html>
<html>
<head>
  <title>HIC Build Planner</title>
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
    <div class="build-panel"></div>
        <div class="build-area">
            <div class="weapon-area">
                <button type="button" id="clear-build" title="Clear build" aria-label="Clear build">x</button>
                <div class="weapon-slot">

                </div>
                <div class="edge-slot">

                </div>
            </div>
            
            <div class="weapon-oils">

                <img class="oil-toggle" data-stat="attack" src="assets/icons/atk_oil.png" alt="Attack Oil">
                <img class="oil-toggle" data-stat="armor" src="assets/icons/arm_oil.png" alt="Armor Oil">
                <img class="oil-toggle" data-stat="speed" src="assets/icons/spd_oil.png" alt="Speed Oil">
            
            </div>
            <div class="item-slots-wrap">
                <div class="item-slots"></div>
                <div class="set-column"></div>
            </div>

            <div class="build-stats">
            <div class="stat-box">
                <img class="stat-icon" src="assets/icons/icon_health.png" alt="Health">
                <span class="stat-value" id="stat-health"></span>
            </div>
            <div class="stat-box">
                <img class="stat-icon" src="assets/icons/icon_attack.png" alt="Attack">
                <span class="stat-value" id="stat-attack"></span>
            </div>
            <div class="stat-box">
                <img class="stat-icon" src="assets/icons/icon_armor.png" alt="Armor">
                <span class="stat-value" id="stat-armor"></span>
            </div>
            <div class="stat-box">
                <img class="stat-icon" src="assets/icons/icon_speed.png" alt="Speed">
                <span class="stat-value" id="stat-speed"></span>
            </div>
            </div>

            <div class="save-panel">
                <div class="save-row">
                    <input type="text" id="build-name" placeholder="Build name...">
                    <button type="button" id="save-build">Save</button>
                </div>
                <div class="save-row">
                    <select id="saved-builds"></select>
                    <button type="button" id="load-build">Load</button>
                    <button type="button" id="delete-build">Delete</button>
                </div>
                <div class="save-row">
                    <button type="button" id="share-build">Copy link</button>
                    <span id="save-status"></span>
                </div>
                <div class="save-row">
                    <button type="button" id="load-screenshot">Load from screenshot</button>
                    <input type="file" id="screenshot-file" accept="image/*" hidden>
                </div>
                <div id="import-status"></div>
            </div>

        </div>
    </div>

    <div class="item-picker">

        <div class="item-grid">

        </div>

        <div class="item-filter">
            <input type="text" id="item-search" placeholder="Search items...">
            <button type="button" id="clear-filters">Clear filters</button>
            <ul class="bundles">
                <li><label class="bundle-icon" for="bundle1"><input type="checkbox" id="bundle1" class="bundle-filter" value="1"><img src="assets/icons/woodland_red.png" alt="Woodlands 1"></label></li>
                <li><label class="bundle-icon" for="bundle2"><input type="checkbox" id="bundle2" class="bundle-filter" value="2"><img src="assets/icons/woodland_blue.png" alt="Woodlands 2"></label></li>
                <li><label class="bundle-icon" for="bundle3"><input type="checkbox" id="bundle3" class="bundle-filter" value="3"><img src="assets/icons/woodland_yellow.png" alt="Woodlands 3"></label></li>
            </ul>
            <ul class="bundles">
                <li><label class="bundle-icon" for="bundle4"><input type="checkbox" id="bundle4" class="bundle-filter" value="4"><img src="assets/icons/swampland_red.png" alt="Swamplands 1"></label></li>
                <li><label class="bundle-icon" for="bundle5"><input type="checkbox" id="bundle5" class="bundle-filter" value="5"><img src="assets/icons/swampland_blue.png" alt="Swamplands 2"></label></li>
                <li><label class="bundle-icon" for="bundle6"><input type="checkbox" id="bundle6" class="bundle-filter" value="6"><img src="assets/icons/swampland_yellow.png" alt="Swamplands 3"></label></li>
            </ul>
            <ul class="bundles" id="darkland-bundles">
                <li><label class="bundle-icon" for="bundle7"><input type="checkbox" id="bundle7" class="bundle-filter" value="7"><img src="assets/icons/darkland_red.png" alt="Darklands 1"></label></li>
                <li><label class="bundle-icon" for="bundle8"><input type="checkbox" id="bundle8" class="bundle-filter" value="8"><img src="assets/icons/darkland_blue.png" alt="Darklands 2"></label></li>
                <li><label class="bundle-icon" for="bundle9"><input type="checkbox" id="bundle9" class="bundle-filter" value="9"><img src="assets/icons/darkland_yellow.png" alt="Darklands 3"></label></li>
            </ul>
            <ul>
                <li><label for="rarity-common"><input type="checkbox" id="rarity-common" class="rarity-filter" value="common">Common</label></li>
                <li><label for="rarity-rare"><input type="checkbox" id="rarity-rare" class="rarity-filter" value="rare">Rare</label></li>
                <li><label for="rarity-heroic"><input type="checkbox" id="rarity-heroic" class="rarity-filter" value="heroic">Heroic</label></li>
                <li><label for="rarity-mythic"><input type="checkbox" id="rarity-mythic" class="rarity-filter" value="mythic">Mythic</label></li>
                <li><label for="rarity-cursed"><input type="checkbox" id="rarity-cursed" class="rarity-filter" value="cursed">Cursed</label></li>
                <li><label for="rarity-cauldron"><input type="checkbox" id="rarity-cauldron" class="rarity-filter" value="cauldron">Cauldron</label></li>
                <li><label for="rarity-cauldron-gold"><input type="checkbox" id="rarity-cauldron-gold" class="rarity-filter" value="cauldron_gold">Gold Cauldron</label></li>
                <li><label for="rarity-set"><input type="checkbox" id="rarity-set" class="rarity-filter" value="set">Set</label></li>
                <li><label for="rarity-boon"><input type="checkbox" id="rarity-boon" class="rarity-filter" value="boon">Boon</label></li>
            </ul>
            <ul>
                <li><label for="tag-edge"><input type="checkbox" id="tag-edge" class="tag-filter" value="edge">Edge</label></li>
                <li><label for="tag-event"><input type="checkbox" id="tag-event" class="tag-filter" value="event">Event</label></li>
                <li><label for="tag-jewelry"><input type="checkbox" id="tag-jewelry" class="tag-filter" value="jewelry">Jewelry</label></li>
                <li><label for="tag-tome"><input type="checkbox" id="tag-tome" class="tag-filter" value="tome">Tome</label></li>
                <li><label for="tag-food"><input type="checkbox" id="tag-food" class="tag-filter" value="food">Food</label></li>
                <li><label for="tag-wood"><input type="checkbox" id="tag-wood" class="tag-filter" value="wood">Wood</label></li>
                <li><label for="tag-stone"><input type="checkbox" id="tag-stone" class="tag-filter" value="stone">Stone</label></li>
                <li><label for="tag-bomb"><input type="checkbox" id="tag-bomb" class="tag-filter" value="bomb">Bomb</label></li>
                <li><label for="tag-sanguine"><input type="checkbox" id="tag-sanguine" class="tag-filter" value="sanguine">Sanguine</label></li>
                <li><label for="tag-water"><input type="checkbox" id="tag-water" class="tag-filter" value="water">Water</label></li>
                <li><label for="tag-instrument"><input type="checkbox" id="tag-instrument" class="tag-filter" value="instrument">Instrument</label></li>
                <li><label for="tag-potion"><input type="checkbox" id="tag-potion" class="tag-filter" value="potion">Potion</label></li>
            </ul>
            <div class="controls-help">
                <p><strong>Click</strong> an item to add it</p>
                <p><strong>Shift + Click</strong> adds the Golden version</p>
                <p><strong>Ctrl + Click</strong> adds the Diamond version</p>
                <p>In your build, click an item to select it, then click another slot to swap or the same item again to remove it. Click your weapon or edge to remove it.</p>
            </div>

            <div class="music-player">
                <select id="track-select" aria-label="Choose a track">
                    <option value="">Choose a track...</option>
                </select>
                <div class="music-controls">
                    <button type="button" id="music-play">Play</button>
                    <button type="button" id="music-loop" aria-pressed="false">Loop: Off</button>
                    <input type="range" id="music-volume" min="0" max="1" step="0.05" value="0.5" aria-label="Volume">
                </div>
            </div>
            <div class="beta-branch">
                <button type="button" id="beta-branch" aria-pressed="false">Beta Branch</button>
                <button type="button" id="hide-unused" aria-pressed="false">Unused Items</button>
            </div>
        </div>

    </div>

    <div class="tooltip" id="tooltip"></div>
    <script src="script.js?v=16"></script>
    <script src="screenshot.js?v=16"></script>
</body>
</html>
